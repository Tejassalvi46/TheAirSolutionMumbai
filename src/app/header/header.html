<!-- Main Header -->
<header>
  <div class="container header-content">
    <div class="logo">
      <!-- Using Angular's standard assets path -->

        <h1>THE AIR SOLUTIONS</h1>

      </div>
    </div>

    <div class="contact-area">
      <div class="contact-box">
        <a href="tel:+917021810743" class="contact-box" style="text-decoration: none; color: inherit; display: block;">
          <img src="assets/images/phone.png" alt="Call us" class="custom-icon-img">
        </a>
        <div class="contact-details">
            <small>Call Us</small>
          </div>
      </div>

      <div class="contact-box">
        <a href="https://wa.me/917021810743" target="_blank" rel="noopener noreferrer" class="contact-box-link"aria-label="Contact us on WhatsApp">

        </a>

          <small>WhatsApp Us</small>
        </div>

      </a>
    </div>
  </div>
</header>
